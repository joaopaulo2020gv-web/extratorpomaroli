services:
  - type: web
    name: extrator-pomaroli-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: UPLOAD_FOLDER
        value: /data/uploads
    disk:
      name: extrator-data
      mountPath: /data
      sizeGB: 1
