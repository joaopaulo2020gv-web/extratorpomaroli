<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator de Questões Pomaroli</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>
    <div id="pomaroli-app"></div>

    <script>
    // =============================================================================
    // CONFIGURAÇÃO GLOBAL (injetada pelo WordPress via shortcode ou wp_localize_script)
    // =============================================================================
    window.APP_CONFIG = window.APP_CONFIG || {};
    window.APP_CONFIG.restUrl = window.APP_CONFIG.restUrl || window.WP_REST_URL || '/wp-json/pomaroli/v1/';
    window.APP_CONFIG.restNonce = window.APP_CONFIG.restNonce || window.WP_REST_NONCE || '';
    window.APP_CONFIG.ajaxUrl = window.APP_CONFIG.ajaxUrl || window.WP_AJAX_URL || '/wp-admin/admin-ajax.php';
    window.APP_CONFIG.userId = window.APP_CONFIG.userId !== undefined ? window.APP_CONFIG.userId : (window.WP_CURRENT_USER_ID || 0);
    </script>

    <!-- ============================================================ -->
    <!-- TELA DE LOGIN -->
    <!-- ============================================================ -->
    <template id="tpl-login">
        <div class="login-screen">
            <div class="login-card">
                <div class="login-badge">EXTRATOR POMAROLI</div>
                <h2>Acesse sua conta</h2>
                <p>Entre com suas credenciais WordPress para acessar o extrator de questões.</p>
                <div id="login-error" class="alert alert-error" style="display:none"></div>
                <form id="login-form">
                    <div class="form-group">
                        <label>Usuário</label>
                        <input type="text" id="login-user" placeholder="seu_usuario" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="login-pass" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block" id="login-btn">
                        <i class="fa-solid fa-right-to-bracket"></i> Entrar
                    </button>
                </form>
            </div>
        </div>
    </template>

    <!-- ============================================================ -->
    <!-- APP PRINCIPAL (Dashboard) -->
    <!-- ============================================================ -->
    <template id="tpl-dashboard">
        <div class="app-layout">
            <!-- Sidebar -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-brand">
                    <div class="brand-icon"><i class="fa-solid fa-layer-group"></i></div>
                    <span class="brand-text">POMAROLI</span>
                </div>
                <nav class="sidebar-nav">
                    <a href="#/" class="nav-item active" data-page="dashboard">
                        <i class="fa-solid fa-chart-line"></i><span>Dashboard</span>
                    </a>
                    <a href="#/jobs" class="nav-item" data-page="jobs">
                        <i class="fa-solid fa-layer-group"></i><span>Processamentos</span>
                    </a>
                    <a href="#/questions" class="nav-item" data-page="questions">
                        <i class="fa-solid fa-list-check"></i><span>Questões</span>
                    </a>
                    <a href="#/ai-review" class="nav-item" data-page="ai-review">
                        <i class="fa-solid fa-robot"></i><span>Revisão IA</span>
                    </a>
                    <a href="#/settings" class="nav-item" data-page="settings">
                        <i class="fa-solid fa-gear"></i><span>Configurações</span>
                    </a>
                </nav>
                <div class="sidebar-footer">
                    <button class="btn btn-ghost btn-sm" id="btn-logout">
                        <i class="fa-solid fa-right-from-bracket"></i> Sair
                    </button>
                </div>
            </aside>

            <!-- Main Content -->
            <div class="main-wrapper">
                <header class="topbar">
                    <button class="btn btn-ghost" id="btn-toggle-sidebar">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <h1 class="page-title" id="page-title">Dashboard</h1>
                    <div class="topbar-actions">
                        <button class="btn btn-primary" id="btn-novo-upload">
                            <i class="fa-solid fa-cloud-arrow-up"></i> Novo Upload
                        </button>
                    </div>
                </header>
                <main class="main-content" id="main-content">
                    <!-- Páginas renderizadas aqui pelo router -->
                </main>
            </div>
        </div>
    </template>

    <!-- ============================================================ -->
    <!-- TEMPLATES DAS PÁGINAS -->
    <!-- ============================================================ -->

    <!-- Dashboard Home -->
    <template id="tpl-page-dashboard">
        <div class="page-dashboard">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon blue"><i class="fa-solid fa-spinner"></i></div>
                    <div class="stat-body">
                        <div class="stat-value" id="stat-active">0</div>
                        <div class="stat-label">Em processamento</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon amber"><i class="fa-solid fa-clock"></i></div>
                    <div class="stat-body">
                        <div class="stat-value" id="stat-queued">0</div>
                        <div class="stat-label">Na fila</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green"><i class="fa-solid fa-check-double"></i></div>
                    <div class="stat-body">
                        <div class="stat-value" id="stat-questions">0</div>
                        <div class="stat-label">Questões extraídas</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon purple"><i class="fa-solid fa-hourglass-half"></i></div>
                    <div class="stat-body">
                        <div class="stat-value" id="stat-pending-review">0</div>
                        <div class="stat-label">Aguardando revisão</div>
                    </div>
                </div>
            </div>

            <div class="card mt-24">
                <div class="card-header">
                    <h2><i class="fa-solid fa-clock-rotate-left"></i> Últimos Processamentos</h2>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Status</th>
                                    <th>Arquivos</th>
                                    <th>Questões</th>
                                    <th>Progresso</th>
                                    <th>Criado em</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="recent-jobs-body">
                                <tr><td colspan="7" class="text-muted text-center">Carregando...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="card mt-24">
                <div class="card-header">
                    <h2><i class="fa-solid fa-history"></i> Atividade Recente</h2>
                </div>
                <div class="card-body">
                    <div id="activity-log" class="activity-list">
                        <div class="text-muted text-center">Carregando...</div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Jobs List -->
    <template id="tpl-page-jobs">
        <div class="page-jobs">
            <div class="card">
                <div class="card-header card-header-flex">
                    <h2><i class="fa-solid fa-layer-group"></i> Processamentos</h2>
                    <div class="flex gap-8">
                        <select id="jobs-filter-status" class="form-select">
                            <option value="">Todos os status</option>
                            <option value="aguardando">Aguardando</option>
                            <option value="processando">Processando</option>
                            <option value="concluido">Concluído</option>
                            <option value="erro">Erro</option>
                            <option value="cancelado">Cancelado</option>
                        </select>
                        <button class="btn btn-primary btn-sm" id="btn-novo-upload-jobs">
                            <i class="fa-solid fa-cloud-arrow-up"></i> Novo
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Batch ID</th>
                                    <th>Status</th>
                                    <th>Arquivos</th>
                                    <th>Questões</th>
                                    <th>Progresso</th>
                                    <th>Criado em</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="jobs-table-body">
                                <tr><td colspan="8" class="text-muted text-center">Carregando...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination" id="jobs-pagination"></div>
                </div>
            </div>
        </div>
    </template>

    <!-- Job Detail -->
    <template id="tpl-page-job-detail">
        <div class="page-job-detail">
            <div class="flex items-center gap-12 mb-24">
                <a href="#/jobs" class="btn btn-ghost btn-sm"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
                <h2 id="job-detail-title">Processamento #--</h2>
            </div>

            <div class="stats-grid stats-grid-3">
                <div class="stat-card">
                    <div class="stat-icon blue"><i class="fa-solid fa-file-pdf"></i></div>
                    <div class="stat-body">
                        <div class="stat-value" id="jd-files">0</div>
                        <div class="stat-label">Arquivos</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green"><i class="fa-solid fa-list-check"></i></div>
                    <div class="stat-body">
                        <div class="stat-value" id="jd-questions">0</div>
                        <div class="stat-label">Questões</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon purple"><i class="fa-solid fa-percent"></i></div>
                    <div class="stat-body">
                        <div class="stat-value" id="jd-progress">0%</div>
                        <div class="stat-label">Progresso</div>
                    </div>
                </div>
            </div>

            <div class="card mt-24">
                <div class="card-header">
                    <h2><i class="fa-solid fa-file-lines"></i> Arquivos do Processamento</h2>
                    <div class="flex gap-8">
                        <button class="btn btn-danger btn-sm" id="jd-btn-cancel" style="display:none">
                            <i class="fa-solid fa-ban"></i> Cancelar
                        </button>
                        <button class="btn btn-warning btn-sm" id="jd-btn-retry" style="display:none">
                            <i class="fa-solid fa-rotate-right"></i> Reenfileirar
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Arquivo</th>
                                    <th>Status</th>
                                    <th>Páginas</th>
                                    <th>Questões</th>
                                    <th>Progresso</th>
                                </tr>
                            </thead>
                            <tbody id="jd-files-body">
                                <tr><td colspan="6" class="text-muted text-center">Carregando...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="card mt-24">
                <div class="card-header card-header-flex">
                    <h2><i class="fa-solid fa-list-check"></i> Questões Extraídas</h2>
                    <button class="btn btn-success btn-sm" id="jd-btn-import">
                        <i class="fa-solid fa-database"></i> Importar para WP
                    </button>
                </div>
                <div class="card-body">
                    <div id="jd-questions-list" class="questions-grid">
                        <div class="text-muted text-center">Carregando...</div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Questions List -->
    <template id="tpl-page-questions">
        <div class="page-questions">
            <div class="card">
                <div class="card-header card-header-flex">
                    <h2><i class="fa-solid fa-list-check"></i> Questões</h2>
                    <div class="flex gap-8 items-center">
                        <input type="text" class="form-input" id="questions-search" placeholder="Buscar questão...">
                        <select id="questions-filter-status" class="form-select">
                            <option value="">Todos os status</option>
                            <option value="extraida">Extraída</option>
                            <option value="revisada">Revisada</option>
                            <option value="publicada">Publicada</option>
                            <option value="rejeitada">Rejeitada</option>
                        </select>
                        <select id="questions-filter-review" class="form-select">
                            <option value="">Todas revisões</option>
                            <option value="pendente">Pendente</option>
                            <option value="aprovada">Aprovada</option>
                            <option value="rejeitada">Rejeitada</option>
                        </select>
                        <button class="btn btn-success btn-sm" id="btn-import-selected" disabled>
                            <i class="fa-solid fa-database"></i> Importar selecionadas
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th><input type="checkbox" id="select-all-questions"></th>
                                    <th>#</th>
                                    <th>Enunciado</th>
                                    <th>Banca</th>
                                    <th>Disciplina</th>
                                    <th>Status</th>
                                    <th>Revisão</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="questions-table-body">
                                <tr><td colspan="8" class="text-muted text-center">Carregando...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination" id="questions-pagination"></div>
                </div>
            </div>
        </div>
    </template>

    <!-- Question Editor Modal -->
    <template id="tpl-modal-question">
        <div class="modal-overlay" id="question-modal">
            <div class="modal-content modal-lg">
                <div class="modal-header">
                    <h3 id="modal-q-title">Editar Questão</h3>
                    <button class="btn btn-ghost modal-close" data-close="question-modal">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="modal-q-id">
                    <div class="form-row">
                        <div class="form-group flex-1">
                            <label>Enunciado</label>
                            <textarea id="modal-q-enunciado" class="form-textarea" rows="6"></textarea>
                        </div>
                    </div>
                    <div class="form-row form-row-2">
                        <div class="form-group">
                            <label>Banca</label>
                            <input type="text" id="modal-q-banca" class="form-input">
                        </div>
                        <div class="form-group">
                            <label>Disciplina</label>
                            <input type="text" id="modal-q-disciplina" class="form-input">
                        </div>
                    </div>
                    <div class="form-row form-row-2">
                        <div class="form-group">
                            <label>Ano</label>
                            <input type="text" id="modal-q-ano" class="form-input">
                        </div>
                        <div class="form-group">
                            <label>Gabarito</label>
                            <input type="text" id="modal-q-gabarito" class="form-input" maxlength="1">
                        </div>
                    </div>
                    <div id="modal-q-alternativas"></div>
                    <div class="form-group mt-12">
                        <label>Comentário / Resolução</label>
                        <textarea id="modal-q-comentario" class="form-textarea" rows="4"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-ghost" data-close="question-modal">Cancelar</button>
                    <button class="btn btn-success" id="modal-q-approve"><i class="fa-solid fa-check"></i> Aprovar</button>
                    <button class="btn btn-warning" id="modal-q-edit"><i class="fa-solid fa-pen"></i> Salvar Edição</button>
                    <button class="btn btn-danger" id="modal-q-reject"><i class="fa-solid fa-xmark"></i> Rejeitar</button>
                </div>
            </div>
        </div>
    </template>

    <!-- AI Review -->
    <template id="tpl-page-ai-review">
        <div class="page-ai-review">
            <div class="card">
                <div class="card-header card-header-flex">
                    <h2><i class="fa-solid fa-robot"></i> Revisão com Inteligência Artificial</h2>
                    <button class="btn btn-primary btn-sm" id="btn-start-ai-review">
                        <i class="fa-solid fa-play"></i> Iniciar Revisão em Massa
                    </button>
                </div>
                <div class="card-body">
                    <div class="ai-review-stats">
                        <div class="ai-stat">
                            <span class="ai-stat-value" id="ai-pending">0</span>
                            <span class="ai-stat-label">Pendentes</span>
                        </div>
                        <div class="ai-stat">
                            <span class="ai-stat-value" id="ai-approved">0</span>
                            <span class="ai-stat-label">Aprovadas</span>
                        </div>
                        <div class="ai-stat">
                            <span class="ai-stat-value" id="ai-rejected">0</span>
                            <span class="ai-stat-label">Rejeitadas</span>
                        </div>
                        <div class="ai-stat">
                            <span class="ai-stat-value" id="ai-edited">0</span>
                            <span class="ai-stat-label">Editadas</span>
                        </div>
                    </div>

                    <div id="ai-review-progress" style="display:none">
                        <div class="progress-header">
                            <span>Processando revisão...</span>
                            <span id="ai-progress-text">0 / 0</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="ai-progress-fill" style="width: 0%"></div>
                        </div>
                    </div>

                    <div class="mt-24">
                        <h3 class="mb-12">Questões Pendentes de Revisão</h3>
                        <div id="ai-review-list" class="questions-grid">
                            <div class="text-muted text-center">Nenhuma questão pendente.</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Settings -->
    <template id="tpl-page-settings">
        <div class="page-settings">
            <div class="card">
                <div class="card-header">
                    <h2><i class="fa-solid fa-gear"></i> Configurações</h2>
                </div>
                <div class="card-body">
                    <form id="settings-form">
                        <div class="settings-section">
                            <h3><i class="fa-solid fa-robot"></i> Inteligência Artificial</h3>
                            <div class="form-row form-row-2">
                                <div class="form-group">
                                    <label>Provedor de IA</label>
                                    <select id="set-ai-provider" class="form-select">
                                        <option value="gemini">Google Gemini</option>
                                        <option value="openai">OpenAI</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Modelo</label>
                                    <input type="text" id="set-ai-model" class="form-input" value="gemini-2.0-flash">
                                </div>
                            </div>
                        </div>

                        <div class="settings-section">
                            <h3><i class="fa-solid fa-server"></i> Backend (Python)</h3>
                            <div class="form-group">
                                <label>URL do Servidor</label>
                                <input type="url" id="set-api-url" class="form-input" placeholder="(Opcional) URL do servidor Python worker">
                                <small class="form-help">URL do servidor Python worker (cPanel)</small>
                            </div>
                        </div>

                        <div class="settings-section">
                            <h3><i class="fa-solid fa-sliders"></i> Processamento</h3>
                            <div class="form-row form-row-2">
                                <div class="form-group">
                                    <label class="switch-label">
                                        <input type="checkbox" id="set-ocr" class="form-checkbox">
                                        <span>Forçar OCR via IA</span>
                                    </label>
                                    <small class="form-help">Ative para PDFs digitalizados/imagem</small>
                                </div>
                                <div class="form-group">
                                    <label class="switch-label">
                                        <input type="checkbox" id="set-auto-save" class="form-checkbox" checked>
                                        <span>Auto-salvar no WordPress</span>
                                    </label>
                                    <small class="form-help">Envia questões automaticamente ao WP</small>
                                </div>
                            </div>
                        </div>

                        <div class="settings-section">
                            <h3><i class="fa-solid fa-shield-halved"></i> Segurança</h3>
                            <div class="form-group">
                                <label>Status do Worker HMAC</label>
                                <div id="set-worker-status" class="status-badge">
                                    <span class="badge badge-green">Configurado</span>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Versão do Banco de Dados</label>
                                <span id="set-db-version" class="text-muted">--</span>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <i class="fa-solid fa-floppy-disk"></i> Salvar Configurações
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </template>

    <!-- Upload Modal -->
    <template id="tpl-modal-upload">
        <div class="modal-overlay" id="upload-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Novo Processamento</h3>
                    <button class="btn btn-ghost modal-close" data-close="upload-modal">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="upload-zone" id="upload-dropzone">
                        <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
                        <h3>Arraste seus PDFs aqui</h3>
                        <p>ou clique para selecionar arquivos</p>
                        <input type="file" id="upload-input" multiple accept=".pdf" style="display:none">
                    </div>
                    <div id="upload-file-list" class="upload-file-list"></div>

                    <div class="mt-16">
                        <h4 class="mb-8">Opções de Processamento</h4>
                        <div class="form-row form-row-2">
                            <div class="form-group">
                                <label class="switch-label">
                                    <input type="checkbox" id="upload-use-ocr" class="form-checkbox">
                                    <span>Forçar OCR via IA</span>
                                </label>
                            </div>
                            <div class="form-group">
                                <label class="switch-label">
                                    <input type="checkbox" id="upload-autocorrect" class="form-checkbox" checked>
                                    <span>Autocorreção IA</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div id="upload-progress" style="display:none" class="mt-16">
                        <div class="progress-header">
                            <span>Enviando arquivos...</span>
                            <span id="upload-progress-text">0%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="upload-progress-fill" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-ghost" data-close="upload-modal">Cancelar</button>
                    <button class="btn btn-primary" id="btn-start-upload" disabled>
                        <i class="fa-solid fa-play"></i> Iniciar Processamento
                    </button>
                </div>
            </div>
        </div>
    </template>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT -->
    <!-- ============================================================ -->
    <script src="assets/js/api.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
